<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水滴涟漪动画测试</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  canvas{position:fixed;inset:0;display:block;cursor:crosshair}
  .hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
        color:rgba(255,255,255,.4);font-family:'Segoe UI','Noto Sans SC',sans-serif;
        font-size:12px;letter-spacing:.12em;pointer-events:none;user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">点击任意处：水滴落下 → 涟漪扩散 → 粒子消散</div>
<script>
(()=>{
"use strict";
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;

/* ── 带角度的俯视投影 ──
   世界坐标：x=左右，z=纵深（向远处），y=高度（向上）。
   俯角 50°：高度映射系数 SHEIGHT，纵深压缩系数 SDEPTH。
   屏幕：sx=CX+x，sy=BASEY+z*SDEPTH-y*SHEIGHT。 */
const PITCH=50*Math.PI/180;
const SDEPTH=Math.sin(PITCH);    // 纵深 → 屏幕 y 的压缩比（≈0.77）
const SHEIGHT=Math.cos(PITCH);   // 高度 → 屏幕 y 的映射比（≈0.64）
const CX=()=>W/2;
const BASEY=()=>H*0.8;           // 水面近端(z=0)的屏幕 y
const ZMAX=()=>BASEY()/SDEPTH;   // 远处水面 z 上限（到屏幕顶）
const proj=(x,y,z)=>({sx:CX()+x, sy:BASEY()+z*SDEPTH-y*SHEIGHT});

let drops=[],ripples=[],parts=[];

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
  drops=[];ripples=[];parts=[];
}
addEventListener("resize",resize); resize();

/* ── 工具 ── */
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;

/* ── 水滴：从高空落到水面 (x,z) ── */
function spawnDrop(x,z){
  const y0=(BASEY()+z*SDEPTH+H*0.1)/SHEIGHT;   // 从屏幕顶外开始
  drops.push({x,z,y:y0,vy:-rand(2,4)*H*0.001});
}

/* ── 一次水滴撞击 ── */
function impact(x,z){
  // 涟漪环：水面上的同心圆，投影成压扁椭圆，向外扩散渐隐
  const rings=Math.random()<0.4?3:2;
  for(let i=0;i<rings;i++){
    ripples.push({x,z,r:rand(4,10),max:rand(H*0.14,H*0.26),
                  spd:rand(H*0.010,H*0.018),alpha:0.9,delay:i*6});
  }

  // 粒子：撞击瞬间沿水面全方位飞散，同时向上抛起（y 为高度）
  const n=Math.round(40+W/DPR/40);
  for(let i=0;i<n;i++){
    const ang=rand(0,TAU);
    const sp=rand(H*0.002,H*0.009);
    parts.push({
      x,z,y:0,
      vx:Math.cos(ang)*sp,        // 左右飞散
      vz:Math.sin(ang)*sp,        // 纵深飞散
      vy:sp*rand(0.7,1.3),        // 向上抛起
      size:rand(1.2,2.6)*DPR,
      alpha:rand(.7,1),
      life:1
    });
  }
}

/* ── 更新：下落的水滴 ── */
function updDrops(){
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.vy-=H*0.0016;               // 重力加速
    d.y+=d.vy;
    if(d.y<=0){
      impact(d.x,d.z);
      drops.splice(i,1);
    }
  }
}

/* ── 更新：涟漪环 ── */
function updRipples(){
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];
    if(r.delay>0){r.delay--;continue;}
    r.r+=r.spd;
    r.alpha=Math.max(0,1-r.r/r.max);
    if(r.alpha<=0)ripples.splice(i,1);
  }
}

/* ── 更新：粒子（飞散后消散）── */
function updParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=0.004;                 // 飞行中缓慢衰减
    p.vx*=0.985; p.vz*=0.985;      // 水平受阻尼
    p.vy-=H*0.0012;                // 高度受重力
    p.x+=p.vx; p.z+=p.vz; p.y+=p.vy;
    if(p.y<=0){
      p.y=0;
      p.life-=0.03;                // 触水后快速消散
    }
    p.alpha=Math.min(1,Math.max(0,p.life*1.6));
    if(p.life<=0){parts.splice(i,1);}
  }
}

/* ── 绘制 ── */
function draw(){
  ctx.fillStyle="rgba(0,0,0,0.3)";   // 轻微拖尾，粒子留下残影轨迹
  ctx.fillRect(0,0,W,H);

  // 透视水面网格（极淡，暗示俯视平面）
  ctx.strokeStyle="rgba(255,255,255,0.045)";
  ctx.lineWidth=1*DPR;
  ctx.beginPath();
  const zStep=ZMAX()/8;
  for(let k=0;k<=8;k++){             // 横线（等 z，由近及远）
    const sy=BASEY()+k*zStep*SDEPTH;
    ctx.moveTo(0,sy); ctx.lineTo(W,sy);
  }
  for(let k=-4;k<=4;k++){            // 纵深线（等 x，向远处延伸）
    const sx=CX()+k*W/8;
    ctx.moveTo(sx,BASEY()); ctx.lineTo(sx,BASEY()+ZMAX()*SDEPTH);
  }
  ctx.stroke();

  // 涟漪环（水面同心圆 → 投影成压扁椭圆）
  for(const r of ripples){
    if(r.delay>0)continue;
    const P=proj(r.x,0,r.z);
    ctx.strokeStyle=`rgba(255,255,255,${(r.alpha*0.55).toFixed(3)})`;
    ctx.lineWidth=Math.max(0.5,r.alpha*2.4)*DPR;
    ctx.beginPath();
    ctx.ellipse(P.sx,P.sy,r.r,r.r*SDEPTH,0,0,TAU);
    ctx.stroke();
  }

  // 粒子：越高越大、越远越小（近大远小 → 3D 感）
  for(const p of parts){
    const P=proj(p.x,p.y,p.z);
    const k=0.8+Math.max(0,p.y)/(H*0.18)-Math.max(0,p.z)/(H*2.2);
    const s=Math.max(0.6,p.size*k);
    ctx.fillStyle=`rgba(255,255,255,${p.alpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(P.sx,P.sy,s,0,TAU);
    ctx.fill();
  }

  // 下落中的水滴（小白点 + 尾迹）
  for(const d of drops){
    const P=proj(d.x,d.y,d.z);
    ctx.fillStyle="rgba(255,255,255,0.95)";
    ctx.beginPath();ctx.arc(P.sx,P.sy,2.2*DPR,0,TAU);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.25)";
    ctx.fillRect(P.sx-0.8*DPR,P.sy-3.5*DPR,1.6*DPR,3.5*DPR);
  }
}

/* ── 主循环（按帧率步进，避免不同刷新率速度不一致）── */
let last=0;
function loop(t){
  const steps=Math.min(2,Math.max(1,Math.round((t-last)/16.7)));
  last=t;
  for(let i=0;i<steps;i++){updDrops();updRipples();updParts();}
  draw();
  requestAnimationFrame(loop);
}

/* ── 自动滴水 + 点击滴水（点击位置反投影到水面）── */
setInterval(()=>{
  spawnDrop(rand(-0.8,0.8)*W/2, rand(0.15,0.75)*ZMAX());
},2200);
spawnDrop(0,ZMAX()*0.4);

cv.addEventListener("pointerdown",e=>{
  const sx=e.clientX*DPR, sy=e.clientY*DPR;
  const x=sx-CX();
  const z=Math.max(0,Math.min(ZMAX()*0.98,(sy-BASEY())/SDEPTH));
  spawnDrop(x,z);
});

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
