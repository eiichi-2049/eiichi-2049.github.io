<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音乐作品 — ReiVerb Sound Atorie</title>
    <meta name="description" content="ReiVerb Sound Atorie — 原创配乐与声音设计" />
    <meta name="robots" content="noindex" />
    <style>
    /* ── 本地字体 ──────────────────────────────────────── */
    @font-face {
        font-family: "OPPO Sans";
        src: url("../../assets/fonts/oppo-sans-subset.woff2") format("woff2");
        font-weight: 100 700;
        font-style: normal;
        font-display: swap;
    }
    /* ── 核心变量（与首页保持一致） ──────────────────────── */
    :root {
        --serif: "Fraunces", "OPPO Sans", sans-serif;
        --zh: "OPPO Sans", "Noto Sans SC", sans-serif;
        --sans: "OPPO Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
        --mono: "DM Mono", monospace;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --nav-h: 96px;
        --sec-pad: clamp(80px, 12vw, 140px);
        --player-h: 80px;
        /* 兼容旧变量名：动态解析新 token */
        --paper: var(--bg);
        --paper2: var(--bg2);
        --surface: var(--bg3);
        --ink4: var(--ink3);
        --red: var(--accent);
        --red-dim: var(--accent-dim);
        --rule: var(--line);
        --rule-h: var(--line2);
    }
    /* ── 暗色主题（默认） ─────────────────────────────── */
    /* ── 重置 ────────────────────────────────────────────── */
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: var(--sans);
        background: var(--paper);
        color: var(--ink);
        font-size: 13px;
        line-height: 1.7;
        min-height: 100vh;
        padding-bottom: calc(var(--player-h) + 2rem);
    }
    /* 主题切换时的平滑过渡 */
    html.theme-transition, html.theme-transition *, html.theme-transition *::before, html.theme-transition *::after {
        transition: background-color 0.35s var(--ease), color 0.35s var(--ease), border-color 0.35s var(--ease), box-shadow 0.35s var(--ease) !important;
    }
    /* ── 页面主体 ────────────────────────────────────────── */
    .page-wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: calc(var(--nav-h) + 40px) 3rem 2rem;
        position: relative;
        z-index: 2;
    }
    /* ── 页面 Hero ──────────────────────────────────────── */
    .page-header {
        margin-bottom: 2rem;
    }
    .page-header::after {
        content: "";
        display: block;
        height: 6px;
        margin-top: 0.5rem;
        background: linear-gradient(to right, transparent 0%, var(--ink3) 10%, var(--ink3) 90%, transparent 100%) 50% 50% / 100% 1px no-repeat, linear-gradient(to right, transparent 0%, var(--ink3) 15%, var(--ink3) 85%, transparent 100%) 50% calc(50% + 2.5px) / 100% 0.5px no-repeat;
        opacity: 0.45;
    }
    .page-back {
        font-size: 11px;
        color: var(--ink3);
        text-decoration: none;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 2rem;
        transition: color 0.2s;
    }
    .page-back:hover {
        color: var(--red);
    }
    .page-title {
        font-family: var(--serif);
        font-size: clamp(2.4rem, 5vw, 4rem);
        font-weight: 300;
        line-height: 1.1;
        color: var(--ink);
        margin-bottom: 1.75rem;
        letter-spacing: -0.02em;
    }
    .page-title em {
        font-style: italic;
        color: var(--red);
    }
    .page-desc {
        font-size: 13px;
        color: var(--ink3);
        max-width: 620px;
        line-height: 1.9;
    }
    /* ── 页脚 ────────────────────────────────────────────── */
    .footer-sub {
        border-top: 1px solid var(--rule);
        padding: 1.25rem 0 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: var(--ink4);
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
    }
    .footer-sub a {
        color: var(--ink3);
        text-decoration: none;
        transition: color 0.2s;
    }
    .footer-sub a:hover {
        color: var(--ink);
    }
    /* ── 响应式 ──────────────────────────────────────────── */
    @media (max-width: 820px) {
        .album-grid {
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        .cover-wrapper {
            max-width: 220px;
            margin: 0 auto;
        }
        .player-now {
            min-width: 100px;
            max-width: 140px;
        }
        .player-now .now-thumb {
            width: 28px;
            height: 28px;
        }
        .player-bar {
            padding: 0 1rem;
        }
        .player-controls .btn-play {
            width: 34px;
            height: 34px;
            font-size: 22px;
        }
        .player-progress-wrap {
            min-width: 60px;
        }
    }
    @media (max-width: 768px) {
        .page-wrap {
            padding: calc(var(--nav-h) + 24px) 1.5rem 1.5rem;
        }
    }
    @media (max-width: 560px) {
        .player-bar {
            padding: 0 1.5rem;
            height: 70px;
        }
        :root {
            --player-h: 70px;
        }
        .player-now .now-title {
            font-size: 11px;
        }
        .player-now .now-artist {
            font-size: 9px;
        }
        .player-controls .btn-skip {
            font-size: 14px;
        }
        .player-controls .btn-play {
            width: 30px;
            height: 30px;
            font-size: 18px;
        }
        .track-item {
            padding: 0.5rem 0.8rem;
            gap: 0.5rem;
        }
        .track-item .track-title {
            font-size: 12px;
        }
        .track-item .track-index {
            font-size: 10px;
            min-width: 1.4rem;
        }
        .track-item .track-duration {
            font-size: 10px;
        }
        .album-section .album-title {
            font-size: 1.3rem;
        }
        .cover-wrapper {
            max-width: 180px;
        }
        .player-progress-wrap .player-time {
            font-size: 9px;
            min-width: 28px;
        }
    }
    @media (max-width: 420px) {
        .cover-wrapper {
            max-width: 140px;
        }
        .player-now {
            min-width: 60px;
            max-width: 80px;
        }
        .player-now .now-thumb {
            display: none;
        }
    }
    /* ── TBD 占位块 ── */
    .tbd-block {
        margin:2rem 0 0;
        padding:28px 30px;
        border:1px solid var(--line);
        border-left:3px solid var(--accent);
        border-radius:12px;
        background:var(--bg2);
    }
    .tbd-tag {
        font-family:var(--mono);
        font-size:.68rem;
        letter-spacing:.18em;
        text-transform:uppercase;
        color:var(--accent);
        margin-bottom:10px;
    }
    .tbd-block p {
        color:var(--ink3);
        font-size:.95rem;
        line-height:1.85;
    }
    .tbd-block p + p {
        margin-top:10px;
    }
    .tbd-block a {
        color:var(--accent);
        border-bottom:1px solid currentColor;
    }
</style>

</head>

    <!-- ── 页面主体 ────────────────────────────────────────── -->
    <main class="page-wrap">

        <header class="project-header">

        </div>

        <footer class="footer-sub">

</body>
