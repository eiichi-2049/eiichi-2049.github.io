<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音乐作品 · ReiVerb Sound Atorie</title>
    <meta name="description" content="ReiVerb Sound Atorie · 原创配乐与声音设计" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500;600&display=swap"
          rel="stylesheet" />
    <style>
        /* ── 本地字体 ──────────────────────────────────────── */
        @font-face {
            font-family: "OPPO Sans";
            src: url("../../assets/fonts/OPPO-Sans-subset.woff2") format("woff2");
            font-weight: 100 700;
            font-style: normal;
            font-display: swap;
        }

        /* ── 核心变量（与首页保持一致） ──────────────────────── */
        :root {
            --serif: "Fraunces", "Noto Serif SC", serif;
            --zh: "OPPO Sans", "Noto Sans SC", sans-serif;
            --sans: "OPPO Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
            --mono: "DM Mono", monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --nav-h: 136px;
            --sec-pad: clamp(80px, 12vw, 140px);
            --player-h: 80px;
            /* 兼容旧变量名：动态解析新 token */
            --paper: var(--bg);
            --paper2: var(--bg2);
            --surface: var(--bg3);
            --ink4: var(--ink3);
            --red: var(--accent);
            --red-dim: var(--accent-dim);
            --rule: var(--line);
            --rule-h: var(--line2);
        }

        /* ── 暗色主题（默认） ─────────────────────────────── */
        :root,
        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #121212;
            --bg2: #1a1a1a;
            --bg3: #1e1e1e;
            --ink: #f5f5f5;
            --ink2: #cccccc;
            --ink3: #9a9c9e;
            --accent: #b0b748;
            --accent-hover: #c6cd63;
            --accent-dim: rgba(176, 183, 72, 0.12);
            --line: rgba(255, 255, 255, 0.07);
            --line2: rgba(255, 255, 255, 0.14);
            --nav-bg: rgba(18, 18, 18, 0.82);
            --overlay-bg: rgba(0, 0, 0, 0.6);
            --wc-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 25px 80px rgba(0, 0, 0, 0.7);
            --shadow-card: 0 2px 16px rgba(0, 0, 0, 0.5);
        }

        /* ── 亮色主题 ─────────────────────────────────────── */
        [data-theme="light"] {
            color-scheme: light;
            --bg: #f9f9f9;
            --bg2: #ffffff;
            --bg3: #f0f0f0;
            --ink: #010205;
            --ink2: #333333;
            --ink3: #a1a4a7;
            --accent: #b0b748;
            --accent-hover: #c6cd63;
            --accent-dim: rgba(176, 183, 72, 0.12);
            --line: rgba(1, 2, 5, 0.07);
            --line2: rgba(1, 2, 5, 0.14);
            --nav-bg: rgba(249, 249, 249, 0.82);
            --overlay-bg: rgba(1, 2, 5, 0.28);
            --wc-shadow: 0 0 0 1px rgba(1, 2, 5, 0.08), 0 25px 80px rgba(1, 2, 5, 0.16);
            --shadow-card: 0 2px 16px rgba(1, 2, 5, 0.08);
        }

        /* ── 重置 ────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--sans);
            background: var(--paper);
            color: var(--ink);
            font-size: 13px;
            line-height: 1.7;
            min-height: 100vh;
            padding-bottom: calc(var(--player-h) + 2rem);
        }


        /* ── 顶部导航（与首页统一：吸顶毛玻璃 + 内层圆角胶囊） ───────────────────── */
        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: var(--nav-h);
            padding: 24px 0;
            background: var(--nav-bg);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
        }

        .nav-in {
            width: 100%;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            background: rgba(1, 2, 5, 0.06);
            border: 1px solid var(--line2);
            border-radius: 16px;
            padding: 0 max(18px, 2.5vw);
        }

        .logo {
            font-family: var(--serif);
            font-size: 1.35rem;
            letter-spacing: -0.02em;
            white-space: nowrap;
            color: var(--ink);
            text-decoration: none;
        }

        .logo em {
            font-style: italic;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 34px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .nav-links a {
            color: var(--ink);
            text-decoration: none;
            opacity: 0.72;
            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        .burger {
            display: none;
            background: none;
            border: none;
            color: var(--ink);
            font-size: 1.4rem;
            cursor: pointer;
        }

        @media (max-width: 760px) {
            .wrap {
                padding: 0 20px;
            }

            .nav-links {
                position: absolute;
                top: var(--nav-h);
                left: 0;
                right: 0;
                background: var(--paper);
                flex-direction: column;
                padding: 20px 40px;
                border-bottom: 1px solid var(--line);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
                gap: 20px;
            }

            .nav-links.open {
                opacity: 1;
                pointer-events: auto;
            }

            .burger {
                display: block;
            }
        }


        /* 主题切换时的平滑过渡 */
        html.theme-transition,
        html.theme-transition *,
        html.theme-transition *::before,
        html.theme-transition *::after {
            transition:
                background-color 0.35s var(--ease),
                color 0.35s var(--ease),
                border-color 0.35s var(--ease),
                box-shadow 0.35s var(--ease) !important;
        }

        /* ── 页面主体 ────────────────────────────────────────── */
        .page-wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: calc(var(--nav-h) + 40px) 3rem 2rem;
            position: relative;
            z-index: 2;
        }

        /* ── 页面 Hero ──────────────────────────────────────── */
        .page-header {
            margin-bottom: 2rem;
        }
        .page-header::after {
            content: "";
            display: block;
            height: 6px;
            margin-top: 0.5rem;
            background:
                linear-gradient(to right, transparent 0%, var(--ink3) 10%, var(--ink3) 90%, transparent 100%) 50% 50% / 100% 1px no-repeat,
                linear-gradient(to right, transparent 0%, var(--ink3) 15%, var(--ink3) 85%, transparent 100%) 50% calc(50% + 2.5px) / 100% 0.5px no-repeat;
            opacity: 0.45;
        }

        .page-back {
            font-size: 11px;
            color: var(--ink3);
            text-decoration: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

            .page-back:hover {
                color: var(--red);
            }

        .page-title {
            font-family: var(--serif);
            font-size: clamp(2.4rem, 5vw, 4rem);
            font-weight: 300;
            line-height: 1.1;
            color: var(--ink);
            margin-bottom: 1.75rem;
            letter-spacing: -0.02em;
        }

            .page-title em {
                font-style: italic;
                color: var(--red);
            }

        .page-desc {
            font-size: 13px;
            color: var(--ink3);
            max-width: 620px;
            line-height: 1.9;
        }

        /* ── 页脚 ────────────────────────────────────────────── */
        .footer-sub {
            border-top: 1px solid var(--rule);
            padding: 1.25rem 0 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--ink4);
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

            .footer-sub a {
                color: var(--ink3);
                text-decoration: none;
                transition: color 0.2s;
            }

                .footer-sub a:hover {
                    color: var(--ink);
                }

        /* ── 响应式 ──────────────────────────────────────────── */
        @media (max-width: 820px) {
            .album-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .cover-wrapper {
                max-width: 220px;
                margin: 0 auto;
            }

            .player-now {
                min-width: 100px;
                max-width: 140px;
            }

                .player-now .now-thumb {
                    width: 28px;
                    height: 28px;
                }

            .player-bar {
                padding: 0 1rem;
            }

            .player-controls .btn-play {
                width: 34px;
                height: 34px;
                font-size: 22px;
            }

            .player-progress-wrap {
                min-width: 60px;
            }
        }

        @media (max-width: 768px) {
            .page-wrap {
                padding: calc(var(--nav-h) + 24px) 1.5rem 1.5rem;
            }

            .nav-links {
                display: none;
            }
        }

        @media (max-width: 560px) {

            .player-bar {
                padding: 0 1.5rem;
                height: 70px;
            }

            :root {
                --player-h: 70px;
            }

            .player-now .now-title {
                font-size: 11px;
            }

            .player-now .now-artist {
                font-size: 9px;
            }

            .player-controls .btn-skip {
                font-size: 14px;
            }

            .player-controls .btn-play {
                width: 30px;
                height: 30px;
                font-size: 18px;
            }

            .track-item {
                padding: 0.5rem 0.8rem;
                gap: 0.5rem;
            }

                .track-item .track-title {
                    font-size: 12px;
                }

                .track-item .track-index {
                    font-size: 10px;
                    min-width: 1.4rem;
                }

                .track-item .track-duration {
                    font-size: 10px;
                }

            .album-section .album-title {
                font-size: 1.3rem;
            }

            .cover-wrapper {
                max-width: 180px;
            }

            .player-progress-wrap .player-time {
                font-size: 9px;
                min-width: 28px;
            }

            .nav-links {
                display: none;
            }
        }

        @media (max-width: 420px) {
            .cover-wrapper {
                max-width: 140px;
            }

            .player-now {
                min-width: 60px;
                max-width: 80px;
            }

                .player-now .now-thumb {
                    display: none;
                }
        }

        /* ── TBD 占位块 ── */
        .tbd-block{margin:2rem 0 0;padding:28px 30px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;background:var(--bg2)}
        .tbd-tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
        .tbd-block p{color:var(--ink3);font-size:.95rem;line-height:1.85}
        .tbd-block p + p{margin-top:10px}
        .tbd-block a{color:var(--accent);border-bottom:1px solid currentColor}
    </style>
    <link rel="stylesheet" href="../../assets/css/subpage.css" />
    <script>
      /* 尽早设置主题，避免页面闪烁（FOUC）—— 跟随系统偏好 */
      (function () {
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
      })();
    </script>
</head>
<body>

    <header class="nav">
        <div class="wrap">
            <div class="nav-in">
                <a class="logo" href="../../index.html#top">ReiVerb Sound <em>Atorie</em></a>

                <nav class="nav-links" id="menu">
                    <a href="../../index.html#work">Work</a>
                    <a href="../../index.html#contact">Contact</a>
                </nav>

                <button class="burger" type="button" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>
            </div>
        </div>
    </header>

    <!-- ── 页面主体 ────────────────────────────────────────── -->
    <main class="page-wrap">

        <header class="project-header">
            <a href="../../index.html#work" class="page-back">← back to work</a>
            <div class="project-eyebrow"><i></i><i></i><span>Compose</span></div>
            <h1 class="project-title">
                <em>[Original Soundtracks]</em>
            </h1>
            <p class="page-desc">为独立游戏创作的音乐作品集 · Original Score for Games</p>
        </header>

        <div class="tbd-block">
            <div class="tbd-tag">TBD · 重新整理中</div>
            <p>音乐作品库正在重新整理：曲目、分轨说明与试听会在整理完成后上线。</p>
            <p>想先了解相关工作，可以看 <a href="../../index.html#work">Selected Work</a> 里的其他项目，或直接 <a href="../../index.html#contact">联系我</a>。</p>
        </div>

        <footer class="footer-sub">
            <span>© 2026 ReiVerb Sound Atorie</span>
            <span class="footer-tag">Composer · Sound Designer · Audio Implementer</span>
        </footer>

    </main>

</body>
</html>
