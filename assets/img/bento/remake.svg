<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <pattern id="rg" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 14 H28 M14 0 V28" stroke="#e8e6e2" stroke-width="0.6" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="#0a0a0c"/>
  <rect width="1000" height="1000" fill="url(#rg)"/>
  <circle cx="760" cy="220" r="130" fill="#d0ff71" opacity="0.05"/>
  <circle cx="240" cy="780" r="150" fill="#b0b748" opacity="0.05"/>

  <!-- staff lines -->
  <g stroke="#e8e6e2" stroke-width="1.6" opacity="0.28">
    <line x1="80" y1="280" x2="920" y2="280"/>
    <line x1="80" y1="320" x2="920" y2="320"/>
    <line x1="80" y1="360" x2="920" y2="360"/>
    <line x1="80" y1="400" x2="920" y2="400"/>
    <line x1="80" y1="440" x2="920" y2="440"/>
  </g>
  <g stroke="#e8e6e2" stroke-width="1.6" opacity="0.22">
    <line x1="80" y1="560" x2="920" y2="560"/>
    <line x1="80" y1="600" x2="920" y2="600"/>
    <line x1="80" y1="640" x2="920" y2="640"/>
    <line x1="80" y1="680" x2="920" y2="680"/>
    <line x1="80" y1="720" x2="920" y2="720"/>
  </g>

  <!-- analysis waveform over staff -->
  <path d="M80 360 C140 360,160 300,200 300 S260 420,300 400 S360 280,420 300 S500 440,560 400 S640 290,700 320 S780 430,840 380 S900 340,920 340"
        fill="none" stroke="#e8e6e2" stroke-width="3.2" opacity="0.55"/>
  <path d="M80 640 C150 640,180 580,230 590 S310 700,360 670 S450 560,520 590 S620 720,690 680 S780 590,850 610 S900 640,920 640"
        fill="none" stroke="#b0b748" stroke-width="2.4" opacity="0.5"/>

  <!-- note heads -->
  <g fill="#d0ff71" opacity="0.85">
    <ellipse cx="200" cy="320" rx="14" ry="10" transform="rotate(-20 200 320)"/>
    <rect x="212" y="220" width="4" height="100"/>
    <ellipse cx="420" cy="400" rx="14" ry="10" transform="rotate(-20 420 400)"/>
    <rect x="432" y="300" width="4" height="100"/>
    <ellipse cx="700" cy="320" rx="14" ry="10" transform="rotate(-20 700 320)"/>
    <rect x="712" y="220" width="4" height="100"/>
  </g>
  <g fill="#e8e6e2" opacity="0.7">
    <ellipse cx="230" cy="600" rx="13" ry="9" transform="rotate(-20 230 600)"/>
    <rect x="241" y="510" width="3.5" height="90"/>
    <ellipse cx="520" cy="680" rx="13" ry="9" transform="rotate(-20 520 680)"/>
    <rect x="531" y="590" width="3.5" height="90"/>
    <ellipse cx="850" cy="600" rx="13" ry="9" transform="rotate(-20 850 600)"/>
    <rect x="861" y="510" width="3.5" height="90"/>
  </g>

  <!-- beat markers -->
  <g fill="#e8e6e2" opacity="0.35">
    <circle cx="160" cy="860" r="4"/><circle cx="280" cy="860" r="4"/>
    <circle cx="400" cy="860" r="4"/><circle cx="520" cy="860" r="4"/>
    <circle cx="640" cy="860" r="4"/><circle cx="760" cy="860" r="4"/>
    <circle cx="880" cy="860" r="4"/>
  </g>
  <g stroke="#b0b748" stroke-width="2" opacity="0.45">
    <line x1="160" y1="840" x2="160" y2="880"/>
    <line x1="280" y1="848" x2="280" y2="872"/>
    <line x1="400" y1="840" x2="400" y2="880"/>
    <line x1="520" y1="848" x2="520" y2="872"/>
    <line x1="640" y1="840" x2="640" y2="880"/>
    <line x1="760" y1="848" x2="760" y2="872"/>
    <line x1="880" y1="840" x2="880" y2="880"/>
  </g>
</svg>
