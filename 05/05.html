<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>05 · EiiChi_2049</title>
    <meta name="description" content="EiiChi_2049" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500;600&display=swap"
          rel="stylesheet" />
    <style>
        /* ── 本地字体 ──────────────────────────────────────── */
        @font-face {
            font-family: "OPPO Sans";
            src: url("../fronts/OPPO_Sans_4.0/OPPO Sans 4.0.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        /* ── 核心变量（与首页保持一致） ──────────────────────── */
        :root {
            --serif: "Fraunces", "Noto Serif SC", serif;
            --zh: "OPPO Sans", "Noto Sans SC", sans-serif;
            --sans: "OPPO Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
            --mono: "DM Mono", monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --nav-h: 64px;
            --sec-pad: clamp(80px, 12vw, 140px);
            /* 兼容旧变量名：动态解析新 token */
            --paper: var(--bg);
            --paper2: var(--bg2);
            --surface: var(--bg3);
            --ink4: var(--ink3);
            --red: var(--accent);
            --red-dim: var(--accent-dim);
            --rule: var(--line);
            --rule-h: var(--line2);
        }

        /* ── 暗色主题（默认） ─────────────────────────────── */
        :root,
        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #121212;
            --bg2: #1a1a1a;
            --bg3: #1e1e1e;
            --ink: #f5f5f5;
            --ink2: #cccccc;
            --ink3: #9a9c9e;
            --accent: #d0ff71;
            --accent-hover: #e2ff9c;
            --accent-dim: rgba(208, 255, 113, 0.12);
            --line: rgba(255, 255, 255, 0.07);
            --line2: rgba(255, 255, 255, 0.14);
            --nav-bg: rgba(18, 18, 18, 0.82);
            --texture-line: rgba(255, 255, 255, 0.03);
            --overlay-bg: rgba(0, 0, 0, 0.6);
            --wc-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 25px 80px rgba(0, 0, 0, 0.7);
            --shadow-card: 0 2px 16px rgba(0, 0, 0, 0.5);
        }

        /* ── 亮色主题 ─────────────────────────────────────── */
        [data-theme="light"] {
            color-scheme: light;
            --bg: #f9f9f9;
            --bg2: #ffffff;
            --bg3: #f0f0f0;
            --ink: #010205;
            --ink2: #333333;
            --ink3: #a1a4a7;
            --accent: #b0b748;
            --accent-hover: #c3ca5e;
            --accent-dim: rgba(176, 183, 72, 0.1);
            --line: rgba(1, 2, 5, 0.07);
            --line2: rgba(1, 2, 5, 0.14);
            --nav-bg: rgba(249, 249, 249, 0.82);
            --texture-line: rgba(1, 2, 5, 0.025);
            --overlay-bg: rgba(1, 2, 5, 0.28);
            --wc-shadow: 0 0 0 1px rgba(1, 2, 5, 0.08), 0 25px 80px rgba(1, 2, 5, 0.16);
            --shadow-card: 0 2px 16px rgba(1, 2, 5, 0.08);
        }

        /* ── 重置 ────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--sans);
            background: var(--paper);
            color: var(--ink);
            font-size: 13px;
            line-height: 1.7;
            min-height: 100vh;
        }

            /* 纸质纹理 */
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, var(--texture-line) 27px, var(--texture-line) 28px);
                pointer-events: none;
                z-index: 0;
            }

        /* ── 顶部导航条 ──────────────────────────────────────── */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 56px;
            border-bottom: 1px solid var(--rule);
            background: var(--nav-bg);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 3rem;
            transition: transform 0.4s var(--ease);
            transform: translateY(0);
        }
        .nav.nav--hidden {
            transform: translateY(-100%);
        }

        .nav-inner {
            max-width: 1080px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-family: var(--serif);
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            display: flex;
            align-items: baseline;
            gap: 10px;
            color: var(--ink);
            text-decoration: none;
        }

        .nav-logo-sub {
            font-family: var(--mono);
            font-size: 0.6rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink3);
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--ink2);
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.2s;
            position: relative;
            padding: 4px 0;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--red);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.25s var(--ease);
        }

        .nav-links a:hover {
            color: var(--ink);
        }

        .nav-links a:hover::after {
            transform: scaleX(1);
        }

        /* ── THEME TOGGLE ─────────────────────────────────── */
        .nav-links .theme-toggle {
            align-self: center;
            position: relative;
            display: inline-flex;
            align-items: center;
            width: 38px;
            height: 20px;
            margin: 0;
            padding: 0 2px;
            border-radius: 10px;
            border: 1px solid var(--line2);
            background: var(--bg3);
            cursor: pointer;
            flex-shrink: 0;
            outline: none;
            vertical-align: middle;
            transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
        }
        .theme-toggle:hover { border-color: var(--accent); }
        .theme-toggle:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
        .theme-toggle-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink2);
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .theme-toggle-icon--sun { left: 5px; }
        .theme-toggle-icon--moon { right: 5px; }
        .theme-toggle-icon svg { width: 11px; height: 11px; }
        .theme-toggle-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            transition: transform 0.3s ease, background 0.3s ease;
            pointer-events: none;
        }
        [data-theme="dark"] .theme-toggle-knob { transform: translateX(18px); }
        [data-theme="dark"] .theme-toggle-icon--sun { opacity: 1; }
        [data-theme="light"] .theme-toggle-icon--moon { opacity: 1; }

        /* 主题切换时的平滑过渡 */
        html.theme-transition,
        html.theme-transition *,
        html.theme-transition *::before,
        html.theme-transition *::after {
            transition:
                background-color 0.35s var(--ease),
                color 0.35s var(--ease),
                border-color 0.35s var(--ease),
                box-shadow 0.35s var(--ease) !important;
        }

        /* ── 页面主体 ────────────────────────────────────────── */
        .page-wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 88px 3rem 2rem;
            position: relative;
            z-index: 2;
        }

        /* ── 页面 Hero ──────────────────────────────────────── */
        .page-header {
            margin-bottom: 2rem;
        }
        .page-header::after {
            content: "";
            display: block;
            height: 6px;
            margin-top: 0.5rem;
            background:
                linear-gradient(to right, transparent 0%, var(--ink3) 10%, var(--ink3) 90%, transparent 100%) 50% 50% / 100% 1px no-repeat,
                linear-gradient(to right, transparent 0%, var(--ink3) 15%, var(--ink3) 85%, transparent 100%) 50% calc(50% + 2.5px) / 100% 0.5px no-repeat;
            opacity: 0.45;
        }

        .page-back {
            font-size: 11px;
            color: var(--ink3);
            text-decoration: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

            .page-back:hover {
                color: var(--red);
            }

        .page-title {
            font-family: var(--serif);
            font-size: clamp(2.4rem, 5vw, 4rem);
            font-weight: 300;
            line-height: 1.1;
            color: var(--ink);
            margin-bottom: 1.75rem;
            letter-spacing: -0.02em;
        }

            .page-title em {
                font-style: italic;
                color: var(--red);
            }

        .page-desc {
            font-size: 13px;
            color: var(--ink3);
            max-width: 620px;
            line-height: 1.9;
        }

        /* ── 页脚 ────────────────────────────────────────────── */
        .footer-sub {
            border-top: 1px solid var(--rule);
            padding: 1.25rem 0 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--ink4);
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 2rem;
        }

            .footer-sub a {
                color: var(--ink3);
                text-decoration: none;
                transition: color 0.2s;
            }

                .footer-sub a:hover {
                    color: var(--ink);
                }

        /* ── 响应式 ────────────────────────────────────────── */
        @media (max-width: 768px) {
            .nav {
                padding: 0 1.5rem;
            }

            .page-wrap {
                padding: 76px 1.5rem 1.5rem;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
    <script>
      /* 尽早设置主题，避免页面闪烁（FOUC）——默认暗色 */
      (function () {
        var root = document.documentElement;
        var stored = null;
        try { stored = localStorage.getItem("theme"); } catch (e) {}
        root.setAttribute("data-theme", stored === "light" ? "light" : "dark");
      })();
    </script>
</head>
<body>
    <!-- ── NAV ──────────────────────────────────────────────── -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="../index.html" class="nav-logo">ReiVerb<span class="nav-logo-sub">Sound Atorie</span></a>
            <ul class="nav-links">
                <li><a href="../index.html#work">Work</a></li>
                <li><a href="../index.html#services">Services</a></li>
                <li><a href="../index.html#about">About</a></li>
                <li><a href="../index.html#contact">Contact</a></li>
                <li>
                    <button
                        class="theme-toggle"
                        id="themeToggle"
                        type="button"
                        aria-label="切换到亮色模式"
                        aria-pressed="true"
                    >
                        <span class="theme-toggle-icon theme-toggle-icon--sun" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="4" />
                                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                            </svg>
                        </span>
                        <span class="theme-toggle-icon theme-toggle-icon--moon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                            </svg>
                        </span>
                        <span class="theme-toggle-knob" aria-hidden="true"></span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- ── 页面主体 ────────────────────────────────────────── -->
    <main class="page-wrap">

        <!-- 页面 Hero -->
        <header class="page-header">
            <a href="../index.html#work" class="page-back">← back to work</a>
            <h1 class="page-title">
                <em>[标题]</em>
            </h1>
            <p class="page-desc">描述文字 · 在此处填写页面简介</p>
        </header>


        <!-- ── 内容区 ────────────────────────────────────────── -->
        <div>
            <!-- 在此添加页面内容 -->
        </div>

        <!-- ── 页脚 ──────────────────────────────────────────── -->
        <footer class="footer-sub">
            <span>© 2026 ReiVerb Sound Atorie</span>
        </footer>
    </main>

    <script>
      /* ── 主题切换按钮（明/暗） ─────────────────── */
      (function () {
        var root = document.documentElement;
        var toggle = document.getElementById("themeToggle");
        if (!toggle) return;

        /* 初始同步按钮状态与当前主题一致 */
        (function () {
          var cur = root.getAttribute("data-theme");
          toggle.setAttribute("aria-pressed", cur === "dark" ? "true" : "false");
          toggle.setAttribute(
            "aria-label",
            cur === "dark" ? "切换到亮色模式" : "切换到暗色模式"
          );
        })();

        function apply(next) {
          root.classList.add("theme-transition");
          clearTimeout(apply._t);
          apply._t = setTimeout(function () {
            root.classList.remove("theme-transition");
          }, 400);

          root.setAttribute("data-theme", next);
          toggle.setAttribute("aria-pressed", next === "dark" ? "true" : "false");
          toggle.setAttribute(
            "aria-label",
            next === "dark" ? "切换到亮色模式" : "切换到暗色模式"
          );
          try { localStorage.setItem("theme", next); } catch (e) {}
        }

        toggle.addEventListener("click", function () {
          var current = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
          apply(current === "dark" ? "light" : "dark");
        });
      })();

        /* ── 导航滚动智能显示隐藏 ─────────────────────── */
        (function () {
            var nav = document.querySelector('.nav');
            if (!nav) return;

            var lastScrollY = window.scrollY || window.pageYOffset;
            var ticking = false;
            var threshold = 100;

            window.addEventListener('scroll', function () {
                if (!ticking) {
                    requestAnimationFrame(function () {
                        var currentScrollY = window.scrollY || window.pageYOffset;

                        if (currentScrollY <= threshold) {
                            nav.classList.remove('nav--hidden');
                        }
                        else if (currentScrollY > lastScrollY && currentScrollY > threshold) {
                            nav.classList.add('nav--hidden');
                        }
                        else if (currentScrollY < lastScrollY) {
                            nav.classList.remove('nav--hidden');
                        }

                        lastScrollY = currentScrollY <= 0 ? 0 : currentScrollY;
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        })();
    </script>
</body>
</html>
