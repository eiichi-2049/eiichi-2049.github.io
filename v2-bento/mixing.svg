<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <pattern id="mg" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.4" fill="#e8e6e2" opacity="0.08"/>
    </pattern>
    <linearGradient id="mfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e6e2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8e6e2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="#0a0a0c"/>
  <rect width="1000" height="1000" fill="url(#mg)"/>

  <!-- soft ambient orbs -->
  <circle cx="220" cy="260" r="140" fill="#b0b748" opacity="0.05"/>
  <circle cx="780" cy="720" r="160" fill="#d0ff71" opacity="0.04"/>

  <!-- horizontal console rails -->
  <line x1="80" y1="210" x2="920" y2="210" stroke="#e8e6e2" stroke-width="1.5" opacity="0.18"/>
  <line x1="80" y1="790" x2="920" y2="790" stroke="#e8e6e2" stroke-width="1.5" opacity="0.18"/>

  <!-- channel faders -->
  <g opacity="0.85">
    <!-- fader 1 -->
    <rect x="150" y="250" width="14" height="420" rx="7" fill="#e8e6e2" opacity="0.08"/>
    <rect x="148" y="360" width="18" height="36" rx="9" fill="#e8e6e2" opacity="0.75"/>
    <rect x="140" y="640" width="34" height="6" rx="3" fill="#b0b748" opacity="0.55"/>
    <!-- fader 2 -->
    <rect x="250" y="250" width="14" height="420" rx="7" fill="#e8e6e2" opacity="0.08"/>
    <rect x="248" y="430" width="18" height="36" rx="9" fill="#e8e6e2" opacity="0.75"/>
    <rect x="240" y="580" width="34" height="6" rx="3" fill="#b0b748" opacity="0.55"/>
    <!-- fader 3 -->
    <rect x="350" y="250" width="14" height="420" rx="7" fill="#e8e6e2" opacity="0.08"/>
    <rect x="348" y="300" width="18" height="36" rx="9" fill="#e8e6e2" opacity="0.75"/>
    <rect x="340" y="700" width="34" height="6" rx="3" fill="#d0ff71" opacity="0.6"/>
    <!-- fader 4 -->
    <rect x="450" y="250" width="14" height="420" rx="7" fill="#e8e6e2" opacity="0.08"/>
    <rect x="448" y="500" width="18" height="36" rx="9" fill="#e8e6e2" opacity="0.75"/>
    <rect x="440" y="520" width="34" height="6" rx="3" fill="#b0b748" opacity="0.55"/>
    <!-- fader 5 -->
    <rect x="550" y="250" width="14" height="420" rx="7" fill="#e8e6e2" opacity="0.08"/>
    <rect x="548" y="390" width="18" height="36" rx="9" fill="#e8e6e2" opacity="0.75"/>
    <rect x="540" y="610" width="34" height="6" rx="3" fill="#d0ff71" opacity="0.6"/>
    <!-- fader 6 -->
    <rect x="650" y="250" width="14" height="420" rx="7" fill="#e8e6e2" opacity="0.08"/>
    <rect x="648" y="470" width="18" height="36" rx="9" fill="#e8e6e2" opacity="0.75"/>
    <rect x="640" y="560" width="34" height="6" rx="3" fill="#b0b748" opacity="0.55"/>
    <!-- fader 7 -->
    <rect x="750" y="250" width="14" height="420" rx="7" fill="#e8e6e2" opacity="0.08"/>
    <rect x="748" y="330" width="18" height="36" rx="9" fill="#e8e6e2" opacity="0.75"/>
    <rect x="740" y="670" width="34" height="6" rx="3" fill="#b0b748" opacity="0.55"/>
    <!-- fader 8 -->
    <rect x="850" y="250" width="14" height="420" rx="7" fill="#e8e6e2" opacity="0.08"/>
    <rect x="848" y="410" width="18" height="36" rx="9" fill="#e8e6e2" opacity="0.75"/>
    <rect x="840" y="600" width="34" height="6" rx="3" fill="#d0ff71" opacity="0.55"/>
  </g>

  <!-- master EQ curve -->
  <path d="M60 520 C160 520, 200 420, 280 400 S420 380, 500 450 S620 620, 720 600 S860 480, 940 470"
        fill="none" stroke="#e8e6e2" stroke-width="3.5" opacity="0.55"/>
  <path d="M60 560 C180 560, 220 500, 300 490 S440 470, 520 530 S640 660, 740 640 S880 540, 940 530"
        fill="none" stroke="#b0b748" stroke-width="2.2" opacity="0.5"/>

  <!-- node markers on curve -->
  <circle cx="280" cy="400" r="7" fill="#d0ff71" opacity="0.85"/>
  <circle cx="500" cy="450" r="7" fill="#e8e6e2" opacity="0.7"/>
  <circle cx="720" cy="600" r="7" fill="#b0b748" opacity="0.85"/>

  <!-- meter bars bottom -->
  <g opacity="0.5">
    <rect x="120" y="860" width="48" height="18" rx="4" fill="#b0b748"/>
    <rect x="180" y="848" width="48" height="30" rx="4" fill="#b0b748"/>
    <rect x="240" y="836" width="48" height="42" rx="4" fill="#d0ff71"/>
    <rect x="300" y="852" width="48" height="26" rx="4" fill="#b0b748"/>
    <rect x="360" y="844" width="48" height="34" rx="4" fill="#e8e6e2"/>
    <rect x="420" y="856" width="48" height="22" rx="4" fill="#b0b748"/>
    <rect x="480" y="840" width="48" height="38" rx="4" fill="#d0ff71"/>
    <rect x="540" y="850" width="48" height="28" rx="4" fill="#b0b748"/>
    <rect x="600" y="858" width="48" height="20" rx="4" fill="#e8e6e2"/>
    <rect x="660" y="842" width="48" height="36" rx="4" fill="#b0b748"/>
    <rect x="720" y="854" width="48" height="24" rx="4" fill="#d0ff71"/>
    <rect x="780" y="846" width="48" height="32" rx="4" fill="#b0b748"/>
  </g>
</svg>
